<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mohammed Sahil R — Cloud & DevOps Engineer terminal portfolio">
  <title>mohammed@sahil:~$</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="terminal" aria-label="Interactive terminal portfolio">
    <header class="terminal-bar">
      <div class="window-buttons" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="terminal-title">mohammed@sahil: ~/portfolio</div>
      <div class="terminal-version">bash</div>
    </header>

    <section class="terminal-body" id="terminal" tabindex="0">
      <div id="output"></div>

      <div class="input-row">
        <span class="prompt">mohammed@sahil:~$</span>
        <input id="commandInput" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" aria-label="Terminal command">
      </div>
    </section>

    <nav class="command-bar" aria-label="Terminal commands">
      <button data-command="help">help</button>
      <button data-command="about">about</button>
      <button data-command="skills">skills</button>
      <button data-command="projects">projects</button>
      <button data-command="aws">aws</button>
      <button data-command="terraform">terraform</button>
      <button data-command="docker">docker</button>
      <button data-command="kubernetes">kubernetes</button>
      <button data-command="cicd">cicd</button>
      <button data-command="linux">linux</button>
      <button data-command="github">github</button>
      <button data-command="resume">resume</button>
      <button data-command="contact">contact</button>
      <button data-command="clear">clear</button>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
